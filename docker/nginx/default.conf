server {
    listen 80;
    server_name localhost codemonkeyg.com www.codemonkeyg.com;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost codemonkeyg.com www.codemonkeyg.com;

    ssl_certificate /etc/letsencrypt/live/codemonkeyg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codemonkeyg.com/privkey.pem;

    # SSL protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/html;
    index index.html index.php;

    # Custom 404 error page
    error_page 404 /404.html;

    # Plain-text robots.txt
    location = /robots.txt {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    # Valid XML sitemap
    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap.xml =404;
    }

    # Redirect /projects to GitHub
    location /projects {
        return 301 https://github.com/CodeMonkeyG;
    }

    # Astro Blog Proxy
    location /blog {
        proxy_pass http://blog:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        client_max_body_size 16k;
        proxy_pass http://mcp:3000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static routes and fallback to 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
    }
}
