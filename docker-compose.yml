services:
  nginx:
    container_name: codemonkeyg-nginx
    image: nginx:alpine
    ports:
      - "8083:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - php

  php:
    container_name: codemonkeyg-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
